<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#090812" />
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="p2Glow" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#08080D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#p2Bg)"/>
  <rect width="800" height="500" rx="20" fill="url(#p2Glow)"/>

  <!-- UI/UX Design System Artboards Mockup -->
  <g transform="translate(70, 60)">
    <!-- Main Artboard (Desktop) -->
    <rect x="0" y="0" width="460" height="340" rx="14" fill="#11111B" stroke="#2B2B42" stroke-width="1.5"/>
    
    <!-- Design Grid / Elements -->
    <rect x="25" y="30" width="120" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.3"/>
    <rect x="25" y="70" width="410" height="70" rx="10" fill="#181829"/>
    
    <circle cx="60" cy="180" r="28" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="130" cy="180" r="28" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="200" cy="180" r="28" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899" stroke-width="1"/>
    
    <rect x="25" y="235" width="200" height="75" rx="8" fill="#181829"/>
    <rect x="240" y="235" width="195" height="75" rx="8" fill="#181829"/>

    <!-- Mobile Artboard Overlapping -->
    <g transform="translate(420, 40)">
      <rect x="0" y="0" width="230" height="330" rx="24" fill="#0E0E18" stroke="url(#p2Grad)" stroke-width="2"/>
      <!-- Mobile Notch/Island -->
      <rect x="75" y="12" width="80" height="12" rx="6" fill="#1E1E2E"/>
      <!-- Mobile UI cards -->
      <rect x="20" y="45" width="190" height="85" rx="12" fill="#18182A" stroke="#8B5CF6" stroke-width="1"/>
      <rect x="20" y="145" width="190" height="50" rx="10" fill="#151522"/>
      <rect x="20" y="210" width="190" height="50" rx="10" fill="#151522"/>
      <circle cx="115" cy="290" r="16" fill="#8B5CF6" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- Centered Floating Title Overlay -->
  <g transform="translate(400, 260)">
    <rect x="-170" y="-30" width="340" height="60" rx="16" fill="#0D0D16" fill-opacity="0.9" stroke="url(#p2Grad)" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">
      Featured Project Placeholder 02
    </text>
    <text x="0" y="16" text-anchor="middle" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="12">
      [ Replace with UI/UX case study image ]
    </text>
  </g>
</svg>
