<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141422" />
      <stop offset="100%" stop-color="#0B0B12" />
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="p1Glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#08080D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#p1Bg)"/>
  <rect width="800" height="500" rx="20" fill="url(#p1Glow)"/>

  <!-- Mock Browser / Code Workspace Frame -->
  <g transform="translate(60, 50)">
    <!-- Window Bar -->
    <rect x="0" y="0" width="680" height="40" rx="12" fill="#1C1C2C" stroke="#2B2B42" stroke-width="1"/>
    <!-- Window Controls -->
    <circle cx="25" cy="20" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="45" cy="20" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="65" cy="20" r="6" fill="#10B981" opacity="0.8"/>
    
    <!-- URL Bar -->
    <rect x="100" y="10" width="480" height="20" rx="6" fill="#12121D"/>
    <text x="340" y="24" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">https://namitha-project-showcase.dev/app</text>

    <!-- Canvas Inner Body -->
    <rect x="0" y="40" width="680" height="350" rx="0" fill="#11111B" stroke="#2B2B42" stroke-width="1"/>
    
    <!-- Mock UI Layout Components -->
    <rect x="30" y="70" width="180" height="120" rx="10" fill="#181828" stroke="url(#p1Grad)" stroke-width="1"/>
    <rect x="230" y="70" width="420" height="120" rx="10" fill="#161624"/>
    
    <rect x="30" y="210" width="420" height="150" rx="10" fill="#161624"/>
    <rect x="470" y="210" width="180" height="150" rx="10" fill="#181828" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Graphic Wave Lines / Data Representation -->
    <path d="M50 160 C 90 120, 130 180, 180 130" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
    <path d="M260 130 C 340 100, 420 160, 600 110" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Centered Luxury Tag Overlay -->
  <g transform="translate(400, 270)">
    <rect x="-170" y="-30" width="340" height="60" rx="16" fill="#0D0D16" fill-opacity="0.9" stroke="url(#p1Grad)" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">
      Featured Project Placeholder 01
    </text>
    <text x="0" y="16" text-anchor="middle" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="12">
      [ Replace with your project screenshot ]
    </text>
  </g>
</svg>
