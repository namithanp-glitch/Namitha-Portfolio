<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1428" />
      <stop offset="100%" stop-color="#070912" />
    </linearGradient>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="p3Glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#08080D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#p3Bg)"/>
  <rect width="800" height="500" rx="20" fill="url(#p3Glow)"/>

  <!-- Code & Interactive Nodes Visual -->
  <g transform="translate(60, 60)">
    <!-- Main Shell Terminal Frame -->
    <rect x="0" y="0" width="680" height="360" rx="14" fill="#0D111A" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="680" height="38" rx="14" fill="#151D2A"/>
    <circle cx="25" cy="19" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="42" cy="19" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="59" cy="19" r="5" fill="#10B981" opacity="0.8"/>
    <text x="340" y="24" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">algorithms-visualizer.js — bash</text>

    <!-- Code & Visual Node graph -->
    <g transform="translate(40, 60)">
      <!-- Code lines -->
      <text x="0" y="25" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="13">const <tspan fill="#60A5FA">visualizeGraph</tspan> = async (nodes, edges) =&gt; {</text>
      <text x="20" y="55" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13">  const canvas = document.querySelector("#viewport");</text>
      <text x="20" y="85" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="13">  await renderOptimizedPath(nodes, { smooth: true });</text>
      <text x="0" y="115" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="13">};</text>
    </g>

    <!-- Floating Graphic Nodes -->
    <g transform="translate(420, 100)">
      <line x1="40" y1="60" x2="160" y2="40" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="160" y1="40" x2="200" y2="130" stroke="#8B5CF6" stroke-width="2"/>
      <line x1="40" y1="60" x2="110" y2="150" stroke="#06B6D4" stroke-width="2"/>
      <line x1="110" y1="150" x2="200" y2="130" stroke="#8B5CF6" stroke-width="2"/>

      <circle cx="40" cy="60" r="18" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
      <text x="40" y="65" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="11">O(1)</text>

      <circle cx="160" cy="40" r="22" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
      <text x="160" y="45" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="11">log N</text>

      <circle cx="110" cy="150" r="16" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="110" y="154" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="10">API</text>

      <circle cx="200" cy="130" r="24" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
      <text x="200" y="135" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="11">DOM</text>
    </g>
  </g>

  <!-- Centered Tag Overlay -->
  <g transform="translate(400, 270)">
    <rect x="-170" y="-30" width="340" height="60" rx="16" fill="#090D16" fill-opacity="0.9" stroke="url(#p3Grad)" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">
      Featured Project Placeholder 03
    </text>
    <text x="0" y="16" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="12">
      [ Replace with web app screenshot ]
    </text>
  </g>
</svg>
