<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111B"/>
      <stop offset="100%" stop-color="#08080D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#faviconGrad)" stroke-width="2"/>
  
  <!-- Monogram NP with Luxury Tech Aesthetic -->
  <g fill="none" stroke="url(#faviconGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Letter N -->
    <path d="M18 44 V20 L30 44 V20" />
    <!-- Letter P -->
    <path d="M38 44 V20 H45 C49 20 52 23 52 27 C52 31 49 34 45 34 H38" />
  </g>
  
  <!-- Accent Sparkle Dot -->
  <circle cx="50" cy="18" r="2.5" fill="#C4B5FD" />
</svg>
